[project]
name = "wealthplan-dp"
version = "0.2.0"
description = """
Stochastic lifecycle planning: a least-squares Monte Carlo (LSMC) Bellman optimizer for
monthly consumption and equity share under income, expenses, pensions and mortality.
"""
authors = [
    {name = "daniel.bergermat@t-online.de"}
]
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy (>=2.3.4,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "numba (>=0.63.1)",
    "pyyaml (>=6.0.3,<7.0.0)",
]

[tool.poetry]
packages = [
    {include = "wealthplan", from = "backend/src"},
    {include = "config", from = "backend/src"},
    {include = "result_cache", from = "backend/src"},
]

[tool.poetry.group.app]
optional = true

[tool.poetry.group.app.dependencies]
streamlit = ">=1.40"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
