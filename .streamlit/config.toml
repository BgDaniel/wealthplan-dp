# Dark navy / purple theme of the wealthplan app (app/streamlit_app.py), layout as in the
# BESS valuation app. Surfaces: page #0c1226 (dark navy), sidebar #0f1630, cards / inputs
# #151d38, borders #1f2747; light lavender-grey text; accent purple, series blue / purple.
[theme]
base = "dark"
primaryColor = "#a07aea"
backgroundColor = "#0c1226"
secondaryBackgroundColor = "#151d38"
textColor = "#e7e9f5"
linkColor = "#b9a0f2"
linkUnderline = false
borderColor = "#1f2747"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "6px"
baseFontSize = 14
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFontWeights = 600
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"
dataframeHeaderBackgroundColor = "#131a33"
dataframeBorderColor = "#1f2747"
blueColor = "#2c6be0"
violetColor = "#a07aea"
chartCategoricalColors = ["#2c6be0", "#a07aea"]

[theme.sidebar]
backgroundColor = "#0f1630"
secondaryBackgroundColor = "#151d38"

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
