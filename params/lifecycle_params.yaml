# ----------------------------
# Simulation parameters for lifecycle financial planning
# ----------------------------
simulation_parameters:
  run_config_id: "lifecycle"
  initial_wealth: 145000.0
  start_date: 2026-01-01
  end_date: 2081-01-01
  retirement_date: 2055-07-01
  current_age: 37.5              # age at start_date (drives the Gompertz mortality)
  yearly_return_savings: 0.02    # risk-free savings account
  beta: 0.999                    # monthly discount factor

# ----------------------------
# Lifecycle cashflows
# ----------------------------
lifecycle:
  # Regular cashflows
  salary:
    monthly_amount: 6800
    retirement_date: 2055-07-01

  rent:
    monthly_amount: 1100

  electricity:
    monthly_amount: 16

  telecommunication:
    monthly_amount: 80

  groceries:
    monthly_amount: 600

  # Insurances
  insurances:
    - name: "Private Liability"
      amount: 50
      frequency: "Y"
    - name: "Dental Supplemental"
      amount: 40
      frequency: "M"
    - name: "Private accident"
      amount: 160
      frequency: "Y"
    - name: "Household Contents"
      amount: 90
      frequency: "Y"
    - name: "Disability"
      amount: 56
      frequency: "M"

# ----------------------------
# Total pension (aggregated & taxed together)
# ----------------------------
total_pension:
  retirement_date: 2055-07-01

  private_pension_plans:
    - name: "Company Pension Plan Uniper"
      monthly_contribution: 0
      monthly_payout_brutto: 30
      taxable_earnings_share: 1.0

    - name: "Private Pension Plan RuV"
      monthly_contribution: 60
      monthly_payout_brutto: 102
      taxable_earnings_share: 0.18

    - name: "Private Life Insurance RuV"
      monthly_contribution: 137
      monthly_payout_brutto: 190
      taxable_earnings_share: 0.18

    - name: "Private Pension Plan HUK"
      initial_monthly_contribution: 114
      monthly_payout_brutto: 334
      taxable_earnings_share: 0.18
      contribution_growth_rate: 0.05
      start_date: 2026-01-01

  public_pension_plan:
    - monthly_payout_brutto: 3100

# ----------------------------
# Stochastic model (LSMC)
# ----------------------------
stochastic:
  yearly_return: 0.07      # expected yearly equity return
  sigma: 0.18              # yearly equity volatility
  n_sims: 2000             # regression paths (backward induction)
  n_sims_oos: 10000        # out-of-sample paths (forward simulation)
  seed: 2906

  survival_model:
    b: 9.5e-5
    c: 0.085
    seed: 123

# ----------------------------
# Technical solver parameters
# ----------------------------
technical:
  w_max: 3000000.0         # upper end of the wealth grid (linear extrapolation beyond)
  n_wealth: 200            # wealth grid points, denser at low wealth
  n_equity_shares: 11      # equity share grid 0 %, 10 %, ..., max_equity_share
  max_equity_share: 1.0
  regression_degree: 0     # LSMC degree in the log equity level (0: i.i.d. GBM, see README)
  shortfall_penalty: 1.0   # utility per euro of fixed expenses that cannot be paid
  apply_terminal_penalty: false
  use_cache: true

# ----------------------------
# Utility function (CRRA)
# ----------------------------
utility_function:
  gamma: 2.0
  epsilon: 1.0
